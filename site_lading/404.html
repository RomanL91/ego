<!doctype html>
<html lang="ru" data-theme="dark">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Страница не найдена</title>
<meta name="robots" content="noindex">
<meta name="theme-color" content="#0C0B09">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Literata:ital,opsz,wght@0,7..72,700;1,7..72,400&family=Onest:wght@400;500&family=JetBrains+Mono:wght@400;700&display=swap">
<style>
:root{--bg:#0C0B09;--fg:#F0EAD6;--muted:#8A8275;--accent:#F59E0B;--line:rgba(240,234,214,.08)}
*{box-sizing:border-box}
body{margin:0;min-height:100vh;display:grid;place-items:center;padding:2rem 1.5rem;
  background:var(--bg);color:var(--fg);
  background-image:linear-gradient(var(--line) 1px,transparent 1px),
                   linear-gradient(90deg,var(--line) 1px,transparent 1px);
  background-size:56px 56px;
  font-family:'Onest','Segoe UI',system-ui,sans-serif;font-size:17px;line-height:1.62}
.box{width:min(560px,100%);display:flex;flex-direction:column;gap:1.2rem}
.mark{font-family:'JetBrains Mono',monospace;font-weight:700;font-size:1.02rem;
  text-decoration:none;color:var(--fg);letter-spacing:-.02em}
.mark b{color:var(--accent)}
.mark s{text-decoration:none;color:var(--muted);font-weight:400}
h1{margin:0;font-family:'Literata',Georgia,serif;font-weight:700;
  font-size:clamp(1.9rem,5vw,2.7rem);line-height:1.1;letter-spacing:-.035em}
h1 em{font-style:italic;font-weight:400;color:var(--accent)}
p{margin:0;color:var(--muted)}
a.btn{align-self:flex-start;background:var(--accent);color:var(--bg);text-decoration:none;
  font-family:'JetBrains Mono',monospace;font-size:.78rem;font-weight:600;
  letter-spacing:.08em;text-transform:uppercase;padding:.85rem 1.35rem;border-radius:4px}
.echo{margin-top:1rem;font-family:'JetBrains Mono',monospace;font-size:.78rem;color:var(--muted)}
.echo b{color:var(--accent);font-weight:400}
</style>
</head>
<body>
<div class="box">
  <a class="mark" href="/"><b>/</b>rlebe<b>[dev]</b><s>.dev</s></a>
  <h1>Такой страницы <em>здесь нет</em></h1>
  <p>Возможно, ссылка устарела. На главной — десять систем в проде и услуги.</p>
  <a class="btn" href="/">на главную</a>
  <div class="echo"><b>$</b> ls: cannot access: No such file or directory</div>
</div>
</body>
</html>
